  <script>
    const starField = document.getElementById("star-field");
    const hearts = document.getElementById("hearts");
    const sparkles = document.getElementById("sparkles");
    const envelope = document.getElementById("envelope");

    const STAR_COUNT = window.innerWidth <= 700 ? 100 : 300;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createStars() {
      starField.innerHTML = "";

      for (let i = 0; i < STAR_COUNT; i++) {
        const star = document.createElement("div");
        star.className = "star";

        const size = Math.random() * 2.5 + 0.5;

        star.style.width = size + "px";
        star.style.height = size + "px";

        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";

        star.style.animationDuration = Math.random() * 3 + 1.5 + "s";

        star.style.animationDelay = Math.random() * 5 + "s";

        if (Math.random() > 0.92) {
          star.classList.add("bright-star");
        }

        starField.appendChild(star);
      }
    }

    createStars();

    function showHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "♡";

      heart.style.setProperty("--x", random(8, 92) + "%");
      heart.style.setProperty("--y", random(12, 78) + "%");

      const isMobile = window.innerWidth <= 700;
      const size = isMobile ? random(14, 25) : random(24, 42);

      heart.style.setProperty("--size", size + "px");

      const duration = random(4, 6);
      heart.style.setProperty("--duration", duration + "s");

      heart.style.setProperty("--rotation", random(-35, 25) + "deg");

      hearts.appendChild(heart);

      setTimeout(
        () => {
          heart.remove();
        },
        duration * 1000 + 100,
      );
    }

    function heartLoop() {
      showHeart();
      setTimeout(heartLoop, random(3500, 7500));
    }

    heartLoop();

    function burstSparks() {
      const rect = envelope.getBoundingClientRect();

      for (let i = 0; i < 3; i++) {
        const spark = document.createElement("div");
        spark.className = "spark";

        spark.style.setProperty(
          "--x",
          rect.left + random(-25, rect.width + 25) + "px",
        );
        spark.style.setProperty(
          "--y",
          rect.top + random(-20, rect.height + 20) + "px",
        );

        spark.style.setProperty("--size", random(2, 4) + "px");
        spark.style.setProperty("--dx", random(-45, 45) + "px");
        spark.style.setProperty("--dy", random(-55, 55) + "px");
        spark.style.setProperty("--duration", random(1.2, 2.6) + "s");

        sparkles.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove(), {
          once: true,
        });
      }

      setTimeout(burstSparks, random(150, 400));
    }

    burstSparks();

    let ticketTimer;

    function openEnvelope() {
      if (envelope.classList.contains("opened")) return;
      envelope.classList.add("opened");

      const music = document.getElementById("bg-music");
      if (music) {
        music.volume = 0.1;
        music.play().catch((error) => {
          console.log("Браузер заблокировал музыку: ", error);
        });
      }

      clearTimeout(ticketTimer);
      ticketTimer = setTimeout(() => {
        const backdrop = document.getElementById("ticket-backdrop");
        backdrop.classList.add("visible");
        backdrop.setAttribute("aria-hidden", "false");
      }, 1350);
    }

    function closeTicket() {
      const backdrop = document.getElementById("ticket-backdrop");

      if (backdrop.contains(document.activeElement)) {
        document.activeElement.blur();
      }

      backdrop.classList.remove("visible");
      backdrop.setAttribute("aria-hidden", "true");
      clearTimeout(ticketTimer);
      setTimeout(() => {
        envelope.classList.remove("opened");
      }, 350);
    }

    document
      .getElementById("ticket-backdrop")
      .addEventListener("click", (event) => {
        if (event.target.id === "ticket-backdrop") closeTicket();
      });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeTicket();
    });

    const textElement = document.getElementById("magic-text");
    const text = textElement.textContent;

    textElement.textContent = "";

    for (let i = 0; i < text.length; i++) {
      const char = text[i];

      if (char === " ") {
        textElement.appendChild(document.createTextNode(" "));
        continue;
      }

      const span = document.createElement("span");
      span.textContent = char;
      span.style.animationDelay = Math.random() * 2 + "s";
      textElement.appendChild(span);
    }
  </script>
</html>
